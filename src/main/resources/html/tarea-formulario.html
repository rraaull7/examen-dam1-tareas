<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de tarea</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2933;
        }

        .app-header {
            background: #1f2937;
            color: white;
            padding: 24px 40px;
        }

        .app-header h1 {
            margin: 0 0 8px 0;
        }

        .app-header p {
            margin: 0;
            color: #d1d5db;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 32px auto;
        }

        .page-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
        }

        .page-title h2 {
            margin: 0 0 6px 0;
        }

        .page-title p {
            margin: 0;
            color: #6b7280;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            background: #e5e7eb;
            color: #111827;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
            flex: 1;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .checkbox-group {
            justify-content: center;
        }

        .checkbox-group label {
            font-weight: normal;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .error-message {
            color: #b91c1c;
            font-size: 13px;
            margin: 6px 0 0 0;
        }
    </style>
</head>
<body>

<header class="app-header">
    <h1>Gestión de tareas</h1>
    <p>Formulario de creación y edición de tareas</p>
</header>

<main class="container">

    <section class="page-title">
        <div>
            <h2 th:text="${tarea.id != 0} ? 'Editar tarea' : 'Nueva tarea'">Nueva tarea</h2>
            <p>Completa los datos de la tarea.</p>
        </div>

        <a class="btn btn-secondary" th:href="@{/tareas}">
            Volver al listado
        </a>
    </section>
    <div th:if="${error}" style="color:red;" th:text="${error}"></div>

    <section class="card">

        <form method="post"
              th:action="${tarea.id != 0} ? @{/tareas/{id}/editar(id=${tarea.id})} : @{/tareas}">


            <div class="form-group">
                <label for="titulo">Título</label>
                <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        th:value="${tarea.titulo}"
                        placeholder="Introduce el título de la tarea">


            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion"
                        name="descripcion"
                        rows="5"
                        placeholder="Describe la tarea"
                    th:text="${tarea.descripcion}"></textarea>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="">Selecciona un estado</option>
                        <option value="PENDIENTE"  th:selected="${tarea.estado == 'PENDIENTE'}">Pendiente</option>
                        <option value="EN_PROCESO" th:selected="${tarea.estado == 'EN_PROCESO'}">En proceso</option>
                        <option value="COMPLETADA" th:selected="${tarea.estado == 'COMPLETADA'}">Completada</option>
                    </select>
                    <p class="error-message">
                        El estado es obligatorio.
                    </p>
                </div>

                <div class="form-group">
                    <label for="prioridad">Prioridad</label>
                    <select id="prioridad" name="prioridad">
                        <option value="">Selecciona una prioridad</option>
                        <option value="BAJA" th:selected="${tarea.prioridad == 'BAJA'}">Baja</option>
                        <option value="MEDIA" th:selected="${tarea.prioridad == 'MEDIA'}">Media</option>
                        <option value="ALTA" th:selected="${tarea.prioridad == 'ALTA'}">Alta</option>
                    </select>

                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="fechaLimite">Fecha límite</label>
                    <input
                            type="date"
                            id="fechaLimite"
                            name="fechaLimite"
                            th:value="${tarea.fechaLimite}">

                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input
                                type="checkbox"
                                id="completada"
                                name="completada"
                        th:checked="${tarea.completada}">
                        Tarea completada
                    </label>
                </div>

            </div>

            <div class="form-group">
                <label for="empleadoId">Persona asignada</label>
                <select id="empleadoId" name="empleado.id" >
                    <option value="">Seleciona una persona</option>
                    <option th:each="emp : ${empleados}"
                            th:value="${emp.id}"
                            th:text="${emp.nombre + ' - ' + emp.email}"
                            th:selected="${tarea.empleado != null and tarea.empleado.id == emp.id}">
                    </option>
                </select>

            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Guardar tarea</button>

                <a class="btn btn-secondary" th:href="@{/tareas}">Cancelar</a>
            </div>

        </form>

    </section>

</main>

</body>
</html>
